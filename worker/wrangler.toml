name = "late-bloomers-explain"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Only the production URL is served; no per-version preview URLs.
preview_urls = false

# No request or response logging.
[observability]
enabled = false

# Hourly rate-limit counters (hashed, expire after one hour).
# Create with:  npx wrangler kv namespace create RATE_LIMIT
# then paste the printed id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e9efdf4d26394b67875cd9c4df4e2e96"

# The Anthropic API key is a secret, set with:  npx wrangler secret put ANTHROPIC_API_KEY
# It is never written to this file or to the repository.
